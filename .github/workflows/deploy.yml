name: Deploy Project to Demo Server

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up SSH key
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      # 3. Optional: Install Node.js if frontend needs build on server
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 4. Optional: Install PHP CLI (needed if composer run remotely)
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      # 5. SSH into server to run deployment commands
      - name: Run deployment commands on server
        run: |
          ssh -o StrictHostKeyChecking=no deploy@${{ secrets.DEPLOY_SERVER_IP }} << 'EOF'
            cd /var/www/techstore
            git pull origin develop
            composer install --no-dev --optimize-autoloader
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            npm ci
            npm run build
          EOF

