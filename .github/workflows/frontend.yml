name: Laravel Frontend Build

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  frontend:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 3. Install NPM dependencies
      - name: Install NPM dependencies
        run: npm ci

      # 4. Build frontend assets via Vite
      - name: Build frontend assets
        run: npm run build

      # 5. Run frontend lint / tests
      - name: Lint frontend
        run: npm run lint || echo "Lint warnings"
